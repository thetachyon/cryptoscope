<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolScope — Solana Block Explorer</title>
<meta name="description" content="SolScope: Etherscan-style explorer for Solana. Data by Solana public RPC.">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230784c3'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/">
      <span class="brand-badge" id="brand-badge">S</span>
      <span class="brand-name" id="brand-name">Sol<span class="brand-accent">Scope</span></span>
    </a>
    <form id="search-form" class="search" autocomplete="off">
      <input id="search-input" type="text" placeholder="Search by Address / Signature / Slot / Token" aria-label="Search">
      <button type="submit" title="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </form>
    <nav class="navlinks">
      <a href="#/" data-nav>Home</a>
      <a href="#/wallet" id="nav-wallet">Wallet</a>
      <a href="#/api-docs">API</a>
      <select id="scope-select" class="chainselect" aria-label="Other scopes" title="Other scopes"></select>
      <span class="netpill" id="netpill" title="Data: Solana public RPC"><span class="dot"></span><span id="netpill-text">Solana Mainnet</span></span>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="error-banner" class="error-banner hidden"></div>
  <div id="view"></div>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <span><span id="footer-brand">SolScope</span> · <a href="#/wallet" id="footer-wallet">Wallet</a> · <a href="#/api-docs">API Docs</a></span>
    <span class="muted">Data: Solana public RPC · No API keys · Keyless</span>
  </div>
</footer>

<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
