name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scope:
          - ethscope
          - sepoliascope
          - optimismscope
          - gnosisscope
          - solscope
          - bitscope
          - walletscope
          - usdtscope
          - usdcscope
          - daiscope
          - usdescope
          - fdusdsscope
          - pyusdsscope
          - tusdscope
          - usddscope
          - overview
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy ${{ matrix.scope }}
        working-directory: ${{ matrix.scope }}
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
