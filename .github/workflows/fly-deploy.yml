name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time: a new push cancels any older run still deploying, so
# stacked pushes can't trip over each other deploying the same app twice.
# Without this, 6 overlapping runs (09:05–09:38) each deployed the same 16
# apps concurrently and none of the later ones cut over.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scope:
          - ethscope
          - sepoliascope
          - optimismscope
          - gnosisscope
          - solscope
          - bitscope
          - walletscope
          - usdtscope
          - usdcscope
          - daiscope
          - usdescope
          - fdusdsscope
          - pyusdsscope
          - tusdscope
          - usddscope
          - overview
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure Fly app exists
        working-directory: ${{ matrix.scope }}
        # fly deploy does NOT create the app: only ethscope (created by hand)
        # ever got a release. The Fly app name is the fly.toml `app` value,
        # not the directory name — overview deploys as cryptoscope-overview
        # because "overview" belongs to an unrelated app. `|| true` lets the
        # step pass when the app already exists; a genuinely taken name still
        # fails loudly at the deploy step below.
        run: flyctl apps create $(grep '^app =' fly.toml | cut -d'"' -f2) || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy ${{ matrix.scope }}
        working-directory: ${{ matrix.scope }}
        # Retry transient Fly failures (deploy-lease conflicts, remote
        # builder hiccups) instead of failing the whole job on the first try.
        run: |
          for i in 1 2 3; do
            flyctl deploy --remote-only && break
            echo "deploy attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
